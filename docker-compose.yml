services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: move_smart_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - move_smart

    webserver:
        image: nginx:alpine
        container_name: move_smart_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - move_smart

    db:
        image: mysql:8.0
        container_name: move_smart_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - move_smart_dbdata:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - move_smart

networks:
    move_smart:
        driver: bridge

volumes:
    move_smart_dbdata:
        driver: local
